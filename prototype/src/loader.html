:root{--navy:#141c2e;--navy2:#1f2a44;--gold:#f5b31b;--ink:#e9edf5;--mute:#93a0b8}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Estedad,Tahoma,sans-serif;background:radial-gradient(1200px 700px at 70% -10%,#2b3a5e 0%,transparent 60%),radial-gradient(900px 600px at 0% 110%,#2a2416 0%,transparent 55%),linear-gradient(160deg,var(--navy2),var(--navy));color:var(--ink);overflow:hidden}
#ld{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(closest-side,#000 40%,transparent);pointer-events:none}
.box{position:relative;text-align:center;width:min(420px,100%);animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.mark{position:relative;width:132px;height:132px;margin:0 auto}
.mark svg{position:absolute;inset:0;width:100%;height:100%}
.nut{animation:spin 6s linear infinite;transform-origin:50% 50%}
.ring{animation:spin 1.6s linear infinite reverse;transform-origin:50% 50%}
.mark img{position:absolute;inset:34px;width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
.en{font-family:Arial,sans-serif;font-weight:700;letter-spacing:.55em;font-size:13px;color:var(--gold);margin-inline-start:.55em}
h1{font-size:28px;font-weight:800;margin:6px 0 2px}
.tag{color:var(--mute);font-size:13.5px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);margin:26px auto 10px;overflow:hidden;width:min(300px,80%)}
.bar i{display:block;height:100%;width:4%;border-radius:9px;background:linear-gradient(90deg,#ffd36b,var(--gold));box-shadow:0 0 14px rgba(245,179,27,.55);transition:width .35s ease;position:relative;overflow:hidden}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 1.3s infinite}
#ldm{font-size:13px;color:var(--mute);min-height:20px;transition:opacity .25s}
#lderr{color:#ffb4b4;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap;margin-top:12px;max-height:30vh;overflow:auto}
.chips{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.chips span{font-size:11.5px;color:#c9d2e3;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.04)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes in{from{opacity:0;transform:translateY(14px)}}@keyframes shine{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.nut,.ring,.bar i:after{animation:none}}
