body.dark button,body.dark input,body.dark select,body.dark dialog{background:#243b31;color:#e0e9dd;border-color:#3f5446}body.dark th,body.dark .visual{background:#eaf0e5;color:#254230}body.dark .step{background:#3c5545}body.dark .notice{background:#51472d;color:#ffe6aa}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:22px}.stats{gap:8px}.stat{padding:15px}}@media(max-width:650px){aside{position:static;width:100%;flex-direction:row;flex-wrap:wrap;padding:10px;gap:3px;border:0}aside .brand,aside .foot{display:none}aside button{font-size:12px;padding:10px}.shell{display:block}main{width:100%;margin:0;padding:16px}.mobile-brand{display:block;font-size:22px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stat{display:flex;justify-content:space-between;align-items:center}.stat strong{margin:0;font-size:24px}.fields{grid-template-columns:1fr}.tools{flex-wrap:wrap}.tools input{flex-basis:100%}h1{font-size:24px}.notice{font-size:11px}.visual{height:170px}}@media print{aside,header,.notice,.actions,dialog .dialoghead button,.toast{display:none!important}main{display:none}dialog[open]{display:block!important;position:static;max-height:none;width:100%;border:0}dialog::backdrop{background:white}.print-only{display:block}.fields input,.fields select{border:0}.step{border:1px solid #ccc}body{background:white;color:#111}}

<body><div class="shell"><aside><div class="brand">کارما<span style="color:#92a86e">.</span><small>KARMA PLATFORM</small></div><button data-nav="catalog" class="active">◈ کاتالوگ محصولات</button><button data-nav="sales">▤ فروش و خرید</button><button data-nav="crm">♧ اشخاص و مشتریان</button><button data-nav="finance">▥ نمای حسابداری</button><button data-nav="guide">ⓘ راهنمای نسخه</button><div class="foot">پروتوتایپ مستقل · ۲٫۰<br>دادهٔ آزمایشی در همین مرورگر<br>بدون اتصال به Google Sheets</div></aside><main><header><div class="mobile-brand">کارما.</div><div><span class="muted">فضای کاری / </span><span id="crumb">کاتالوگ محصولات</span></div><div class="row"><select id="unit" aria-label="واحد تجاری"><option value="karma">کارما</option><option value="mad">آلیاژ پیچ کار ماد</option></select><button id="theme" aria-label="تغییر پوسته">◐</button><button id="basket" class="primary">لیست انتخاب <span id="count">۰</span></button></div></header><div class="notice">نسخهٔ نمایشی آفلاین — اسناد، قیمت‌ها و ثبت حسابداری این فایل آزمایشی‌اند. هیچ داده‌ای به سرور یا گوگل شیت ارسال نمی‌شود.</div><section id="content"></section></main></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="row dialoghead"><h2 id="modal-title"></h2><button id="close" aria-label="بستن">✕</button></div><div id="modal-body"></div></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
'use strict';
const products=__PRODUCTS__, images=__IMAGES__, $=s=>document.querySelector(s), fa=n=>new Intl.NumberFormat('fa-IR').format(n), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='karma-prototype-v2-isolated', stages=['پیش‌نویس','ارسال‌شده','تأیید‌شده','در حال تأمین','تأمین‌شده','فاکتور صادرشده'];
let state={docs:[],parties:[],next:1}, storage=true;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.docs)&&Array.isArray(saved.parties)&&Number.isSafeInteger(saved.next))state=saved;}catch{storage=false;}
let section='catalog', basket=[], current=null, timer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storage=false;notify('ذخیره در این مرورگر فعال نیست؛ خروجی JSON بگیرید.')}}
function notify(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function unit(){return $('#unit').value}function docs(){return state.docs.filter(d=>d.unit===unit())}function parties(){return state.parties.filter(p=>p.unit===unit())}
function intro(kicker,title,description){return `<div class="row intro"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1><p class="muted">${description}</p></div></div>`}
function open(title,html){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
function empty(text){return `<div class="empty">${text}</div>`}
function total(d){return d.lines.reduce((s,l)=>s+BigInt(l.qty)*BigInt(l.price),0n)}
function navigate(s){section=s;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===s));$('#crumb').textContent=document.querySelector(`[data-nav="${s}"]`).textContent.slice(2);render()}
function render(){
 if(section==='catalog'){$('#content').innerHTML=intro('کالاهای صنعتی / DIN + ASTM','انتخاب دقیق، خرید مطمئن','نمونه‌های واقعی از کاتالوگ کارما؛ کد KR بدون تغییر حفظ شده است.')+`<div class="tools"><input id="search" aria-label="جستجوی محصول" placeholder="نام محصول، استاندارد یا کد KR را جستجو کنید…"><select id="standard" aria-label="استاندارد"><option value="">همهٔ استانداردها</option>${[...new Set(products.map(p=>p.standard))].map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><p class="muted" id="result-count"></p><div class="grid" id="products" style="margin-top:16px"></div><div class="actions"><button id="more" hidden>نمایش بیشتر</button></div>`;$('#search').oninput=()=>catalog();$('#standard').onchange=()=>catalog();catalog();}
 if(section==='sales'){$('#content').innerHTML=intro('گردش فروش','از انتخاب کالا تا فاکتور','برای شروع، کالاها را از کاتالوگ به لیست انتخاب اضافه کنید.')+`<div class="stats"><div class="stat">پیش‌فاکتورهای آزمایشی<strong>${fa(docs().length)}</strong></div><div class="stat">فاکتور صادرشده<strong>${fa(docs().filter(d=>d.stage===5).length)}</strong></div><div class="stat">فروش آزمایشی · ریال<strong>${fa(docs().filter(d=>d.stage===5).reduce((s,d)=>s+total(d),0n))}</strong></div></div><div class="panel scroll">${docs().length?`<table><thead><tr><th>شماره</th><th>مشتری</th><th>تاریخ</th><th>وضعیت</th><th>مبلغ · ریال</th><th></th></tr></thead><tbody>${docs().slice().reverse().map(d=>`<tr><td dir="ltr">DEMO-${d.id}</td><td>${esc(d.customer)}</td><td>${esc(d.date)}</td><td><span class="badge">${stages[d.stage]}</span></td><td>${fa(total(d))}</td><td><button data-doc="${d.id}">مشاهده و ادامه</button></td></tr>`).join('')}</tbody></table>`:empty('هنوز سندی برای این واحد ثبت نشده است.')}</div>`;document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>showDoc(Number(b.dataset.doc)));}
 if(section==='crm'){$('#content').innerHTML=intro('ارتباط با مشتریان','اشخاص و مشتریان','فهرست اشخاص آزمایشی مختص واحد تجاری انتخاب‌شده.')+`<button class="primary" id="new-party">افزودن شخص</button><div class="panel scroll" style="margin-top:20px">${parties().length?`<table><thead><tr><th>نام</th><th>شماره تماس</th></tr></thead><tbody>${parties().map(p=>`<tr><td>${esc(p.name)}</td><td dir="ltr">${esc(p.phone)}</td></tr>`).join('')}</tbody></table>`:empty('هنوز شخصی ثبت نشده است.')}</div>`;$('#new-party').onclick=()=>{open('شخص جدید',`<form id="party-form"><div class="fields"><label>نام شخص<input id="party-name" required maxlength="120"></label><label>شماره تماس<input id="party-phone" dir="ltr" maxlength="30"></label></div><button class="primary">ذخیرهٔ شخص آزمایشی</button></form>`);$('#party-form').onsubmit=e=>{e.preventDefault();const name=$('#party-name').value.trim();if(!name)return;state.parties.push({name,phone:$('#party-phone').value,unit:unit()});save();$('#modal').close();render();notify('شخص ذخیره شد')}};}
 if(section==='finance'){const invoices=docs().filter(d=>d.stage===5);$('#content').innerHTML=intro('نمونهٔ ثبت دوطرفه','نمای حسابداری آزمایشی','فقط نمونهٔ سادهٔ ثبت فاکتور؛ فاقد مالیات، برگشت، دریافت و دفاتر قانونی.')+`<div class="panel scroll">${invoices.length?`<table><thead><tr><th>مرجع آزمایشی</th><th>حساب</th><th>بدهکار · ریال</th><th>بستانکار · ریال</th></tr></thead><tbody>${invoices.map(d=>`<tr><td dir="ltr">DEMO-${d.id}</td><td>حساب‌های دریافتنی / ${esc(d.customer)}</td><td>${fa(total(d))}</td><td>۰</td></tr><tr><td dir="ltr">DEMO-${d.id}</td><td>فروش</td><td>۰</td><td>${fa(total(d))}</td></tr>`).join('')}</tbody></table>`:empty('با صدور فاکتور آزمایشی، نمونهٔ ثبت در این بخش دیده می‌شود.')}</div>`;}
 if(section==='guide'){$('#content').innerHTML=intro('راهنمای استفاده','پروتوتایپ مستقل کارما','این فایل برای بررسی ظاهر و گردش کار است؛ سامانهٔ عملیاتی نیست.')+`<div class="panel"><h2>چطور امتحان کنم؟</h2><p>۱. در کاتالوگ جستجو کنید و کالا انتخاب کنید.<br>۲. لیست انتخاب را باز کنید، مشتری، تعداد و قیمت آزمایشی را بنویسید.<br>۳. پیش‌فاکتور بسازید و مراحل تأیید، تأمین و صدور را ادامه دهید.<br>۴. نمای حسابداری و تفکیک دو واحد را بررسی کنید.<br>۵. برای نگهداری اطلاعات نمونه، خروجی JSON بگیرید.</p><h2 style="margin-top:24px">اتصال به Google Sheets</h2><p>این فایل اتصال به شیت ندارد. نسخهٔ Django/PostgreSQL هم مستقیماً در Apps Script اجرا نمی‌شود. برای استفادهٔ شیت به‌عنوان محل داده، باید آداپتور Apps Script، نگاشت ستون‌ها، اعتبارسنجی سمت سرور، قفل نوشتن و کنترل دسترسی پیاده شود. بستهٔ قبلی GoogleSheets v1.3.0 با این نسخهٔ جدید متفاوت است.</p><h2 style="margin-top:24px">محدودهٔ این نمونه</h2><p>کاتالوگ شامل ${fa(products.length)} گونهٔ واقعی منتخب است؛ عکس و فونت در فایل جاسازی شده‌اند. قیمت تعیین نشده است. اطلاعات اشخاص و اسناد فقط در مرورگر شما ذخیره می‌شود و با پاک‌کردن دادهٔ مرورگر ممکن است از بین برود. این نمونه احراز هویت، تفکیک امن کاربران، امضای دیجیتال یا ثبت قانونی ندارد. ثبت حسابداری مشتق از وضعیت فاکتور و صرفاً نمایشی است.</p><div class="actions"><button id="export">خروجی داده‌های آزمایشی JSON</button><button class="danger" id="reset">پاک‌کردن همهٔ داده‌های آزمایشی</button></div></div>`;$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({prototype:'2.0.0',...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='karma-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#reset').onclick=()=>{if(confirm('همهٔ اشخاص و اسناد آزمایشی هر دو واحد پاک شوند؟')){state={docs:[],parties:[],next:1};basket=[];save();updateCount();render();notify('داده‌های نمونه پاک شدند')}};}
}
let limit=24;function normalize(s){return s.toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[^\p{L}\p{N}]+/gu,'')}
function catalog(more=false){limit=more?limit+24:24;const words=$('#search').value.trim().split(/\s+/).map(normalize).filter(Boolean),standard=$('#standard').value,filtered=products.filter(p=>(!standard||p.standard===standard)&&words.every(w=>normalize(p.name+p.tech+p.code+p.standard).includes(w)));$('#result-count').textContent=`${fa(filtered.length)} کالای منتخب؛ نمایش ${fa(Math.min(filtered.length,limit))} مورد`;
 $('#products').innerHTML=filtered.slice(0,limit).map(p=>`<article class="card"><div class="visual">${images[p.image]?`<img src="${images[p.image]}" alt="${esc(p.name)}" loading="lazy">`:'<span class="placeholder" aria-hidden="true">⬡</span>'}</div><div class="card-body"><span class="tag">${esc(p.standard)}</span><h3>${esc(p.name)}</h3><p class="code">${esc(p.tech)}</p><small class="muted">سایز ${esc(p.size)} · گرید ${esc(p.grade)}</small><div class="row"><small dir="ltr">${esc(p.code)}</small><button data-add="${p.code}" class="${basket.some(l=>l.code===p.code)?'primary':''}">${basket.some(l=>l.code===p.code)?'انتخاب شد ✓':'+ انتخاب'}</button></div></div></article>`).join('')||empty('کالایی در نمونه‌های این فایل پیدا نشد.');$('#more').hidden=filtered.length<=limit;$('#more').onclick=()=>catalog(true);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(!basket.some(l=>l.code===b.dataset.add)){basket.push({code:b.dataset.add,qty:'1',price:'0'});updateCount();b.textContent='انتخاب شد ✓';b.classList.add('primary');notify('به لیست انتخاب اضافه شد')}else notify('این کالا قبلاً انتخاب شده است')});}
function updateCount(){$('#count').textContent=fa(basket.length)}
function showBasket(){current=null;if(!basket.length){open('لیست انتخاب',empty('ابتدا کالایی از کاتالوگ انتخاب کنید.'));return}open('ساخت پیش‌فاکتور آزمایشی',`<form id="quote-form"><div class="fields"><label>نام مشتری<input id="customer" list="customers" maxlength="120" required><datalist id="customers">${parties().map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></label><label>واحد تجاری<input value="${esc($('#unit').selectedOptions[0].textContent)}" readonly></label></div><div class="scroll"><table><thead><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد · ریال</th><th></th></tr></thead><tbody>${basket.map((l,i)=>`<tr><td><small>${esc(products.find(p=>p.code===l.code).name)}</small><div class="code">${l.code}</div></td><td><input style="width:90px" aria-label="تعداد ردیف ${i+1}" type="number" min="1" max="1000000" step="1" value="${l.qty}" data-qty="${i}" required></td><td><input style="width:155px" aria-label="قیمت ردیف ${i+1}" type="number" min="1" max="100000000000000" step="1" value="${l.price}" data-price="${i}" required></td><td><button type="button" data-remove="${i}" aria-label="حذف ردیف ${i+1}">✕</button></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="primary">ذخیرهٔ پیش‌نویس آزمایشی</button></div></form>`);document.querySelectorAll('[data-qty]').forEach(e=>e.oninput=()=>basket[Number(e.dataset.qty)].qty=e.value);document.querySelectorAll('[data-price]').forEach(e=>e.oninput=()=>basket[Number(e.dataset.price)].price=e.value);document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{basket.splice(Number(e.dataset.remove),1);updateCount();showBasket()});$('#quote-form').onsubmit=e=>{e.preventDefault();const customer=$('#customer').value.trim();if(!customer)return;const d={id:state.next++,unit:unit(),customer,date:new Intl.DateTimeFormat('fa-IR',{timeZone:'Asia/Tehran'}).format(new Date()),stage:0,lines:structuredClone(basket)};state.docs.push(d);save();basket=[];updateCount();navigate('sales');showDoc(d.id)};}
function showDoc(id){const d=docs().find(d=>d.id===id);if(!d)return;current=id;open(`سند آزمایشی DEMO-${d.id}`,`<p class="print-only">نسخهٔ نمایشی — فاقد اعتبار مالی و قانونی</p><p>مشتری: <b>${esc(d.customer)}</b> · ${esc(d.date)} · ${esc($('#unit').selectedOptions[0].textContent)}</p><div class="steps">${stages.map((s,i)=>`<span class="step ${i<=d.stage?'done':''}">${fa(i+1)}. ${s}</span>`).join('')}</div><div class="scroll"><table><thead><tr><th>کد کالا</th><th>تعداد</th><th>قیمت واحد · ریال</th><th>مبلغ · ریال</th></tr></thead><tbody>${d.lines.map(l=>`<tr><td dir="ltr">${esc(l.code)}</td><td>${fa(BigInt(l.qty))}</td><td>${fa(BigInt(l.price))}</td><td>${fa(BigInt(l.qty)*BigInt(l.price))}</td></tr>`).join('')}</tbody></table></div><p class="total" style="margin-top:22px">جمع: ${fa(total(d))} ریال</p><p class="muted">بدون محاسبهٔ مالیات و تخفیف؛ صرفاً برای نمایش گردش کار</p>${d.stage===3?'<label style="display:block;margin-top:20px"><input type="checkbox" id="fulfilled" style="width:auto"> تأمین همهٔ ردیف‌ها را در این نمونه تأیید می‌کنم</label>':''}<div class="actions">${d.stage<5?`<button class="primary" id="advance">${['ارسال پیش‌فاکتور','تأیید مشتری','شروع تأمین','تکمیل تأمین','صدور فاکتور آزمایشی'][d.stage]}</button>`:'<span class="badge">نمونهٔ ثبت دوطرفه در نمای حسابداری ایجاد شد</span>'}<button id="print">چاپ / ذخیرهٔ PDF</button></div>`);$('#print').onclick=()=>window.print();if($('#advance'))$('#advance').onclick=()=>{if(d.stage===3&&!$('#fulfilled').checked){notify('تکمیل تأمین ردیف‌ها را تأیید کنید');return}d.stage++;save();render();showDoc(d.id)};}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));$('#basket').onclick=showBasket;$('#close').onclick=()=>$('#modal').close();$('#unit').onchange=()=>{basket=[];updateCount();$('#modal').close();render();notify('واحد تغییر کرد؛ لیست انتخاب پاک شد')};$('#theme').onclick=()=>document.body.classList.toggle('dark');document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#modal').open){navigate('catalog');$('#search').focus()}}});render();if(!storage)notify('ذخیره‌سازی مرورگر در دسترس نیست؛ اطلاعات موقت‌اند.');
</script></body></html>
