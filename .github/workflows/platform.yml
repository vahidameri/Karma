name: Karma platform
on:
  push:
    paths: ['platform/**', '.github/workflows/platform.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: karma_e2e
          POSTGRES_USER: karma
          POSTGRES_PASSWORD: ci-only-disposable-database
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U karma -d karma_e2e' --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      elasticsearch:
        image: elasticsearch:8.19.3
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: karma_e2e
      POSTGRES_USER: karma
      POSTGRES_PASSWORD: ci-only-disposable-database
      REDIS_URL: redis://127.0.0.1:6379/0
      KARMA_TASK_QUEUE: karma_e2e
      NEXT_TELEMETRY_DISABLED: '1'
      XDG_CACHE_HOME: /tmp/karma-cache
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/karma-hypothesis
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: platform/frontend/package-lock.json}
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install -r platform/backend/requirements-dev.txt
      - run: ruff check platform/backend && ruff format --check platform/backend
      - run: python manage.py makemigrations --check --dry-run && python manage.py test tests --noinput
        working-directory: platform/backend
      - name: Prepare disposable catalogue and accounts
        working-directory: platform/backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_platform
          python manage.py seed_accounts
          python manage.py import_legacy_catalog --source ../data/legacy
          python manage.py import_dimensions ../../output/DIN_full_tables.json ../data/legacy/astm-dimensions.json
          python manage.py collectstatic --noinput
          python ../scripts/e2e_fixture.py
      - name: Wait for Elasticsearch and index source data
        working-directory: platform/backend
        env: {ELASTICSEARCH_URL: 'http://127.0.0.1:9200'}
        run: |
          python - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:9200/_cluster/health', timeout=2)
                  break
              except OSError: time.sleep(2)
          else: raise SystemExit('Elasticsearch did not start')
          PY
          python manage.py reindex
      - name: Build frontend
        working-directory: platform/frontend
        run: npm ci --no-audit --no-fund && npm run build && npx playwright install --with-deps chromium
      - name: Start application and workers
        working-directory: platform/backend
        env: {ELASTICSEARCH_URL: 'http://127.0.0.1:9200'}
        run: |
          nohup gunicorn config.wsgi:application --bind 127.0.0.1:8000 --no-control-socket >/tmp/karma-backend.log 2>&1 &
          nohup celery -A config.celery:app worker --loglevel WARNING --concurrency 2 >/tmp/karma-worker.log 2>&1 &
          nohup celery -A config.celery:app beat --loglevel WARNING --schedule /tmp/karma-ci-beat >/tmp/karma-beat.log 2>&1 &
      - name: Start frontend
        working-directory: platform/frontend
        run: nohup npm run start >/tmp/karma-frontend.log 2>&1 &
      - name: Exercise browser workflows
        working-directory: platform/frontend
        env: {KARMA_E2E_CREDENTIALS: /tmp/karma-e2e-credentials.json}
        run: |
          node -e "(async()=>{for(let i=0;i<40;i++){try{const r=await fetch('http://127.0.0.1:3000/api/v1/health/');if(r.ok)return}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)})()"
          npm test
